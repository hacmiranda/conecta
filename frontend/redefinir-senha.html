<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir Senha - DESKCRP</title>
    <link rel="icon" type="image/png" href="images/logo_vazado.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 90%;
            max-width: 400px;
        }
        
        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .logo img {
            width: 80px;
            height: 80px;
        }
        
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 1.5rem;
        }
        
        .form-group {
            margin-bottom: 1rem;
        }
        
        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #555;
            font-weight: bold;
        }
        
        input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn {
            width: 100%;
            padding: 0.75rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 1rem;
        }
        
        .btn:hover {
            opacity: 0.9;
        }
        
        .message {
            padding: 1rem;
            border-radius: 5px;
            margin-bottom: 1rem;
            text-align: center;
        }
        
        .error {
            background: #fee;
            color: #c33;
            border: 1px solid #fcc;
        }
        
        .success {
            background: #efe;
            color: #3c3;
            border: 1px solid #cfc;
        }
        
        .back-link {
            text-align: center;
            margin-top: 1rem;
        }
        
        .back-link a {
            color: #667eea;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="images/logo_vazado.png" alt="DESKCRP">
        </div>
        
        <h2>Redefinir Senha</h2>
        
        <div id="message"></div>
        
        <form id="form-redefinir">
            <div class="form-group">
                <label>Nova Senha:</label>
                <input type="password" id="senha" required minlength="8">
                <div style="margin-top: 0.5rem; padding: 0.75rem; background: #f8f9fa; border-radius: 4px; border: 1px solid #ddd; font-size: 0.85rem;">
                    <div style="margin-bottom: 0.25rem; color: #666;">A senha deve conter:</div>
                    <div id="check-length" style="color: #999;">✗ Mínimo 8 caracteres</div>
                    <div id="check-upper" style="color: #999;">✗ Pelo menos 1 letra maiúscula</div>
                    <div id="check-lower" style="color: #999;">✗ Pelo menos 1 letra minúscula</div>
                    <div id="check-number" style="color: #999;">✗ Pelo menos 1 número</div>
                    <div id="check-special" style="color: #999;">✗ Pelo menos 1 caractere especial (!@#$%^&*)</div>
                </div>
            </div>
            
            <div class="form-group">
                <label>Confirmar Senha:</label>
                <input type="password" id="confirmar-senha" required minlength="8">
            </div>
            
            <button type="submit" class="btn">Redefinir Senha</button>
        </form>
        
        <div class="back-link">
            <a href="login.html">Voltar para o login</a>
        </div>
    </div>
    
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        
        if (!token) {
            document.getElementById('message').innerHTML = '<div class="message error">Token inválido ou ausente.</div>';
            document.getElementById('form-redefinir').style.display = 'none';
        }
        
        // Validar complexidade da senha em tempo real
        document.getElementById('senha').addEventListener('input', function() {
            const senha = this.value;
            
            const temLength = senha.length >= 8;
            const temUpper = /[A-Z]/.test(senha);
            const temLower = /[a-z]/.test(senha);
            const temNumber = /[0-9]/.test(senha);
            const temSpecial = /[!@#$%^&*]/.test(senha);
            
            document.getElementById('check-length').style.color = temLength ? '#28a745' : '#999';
            document.getElementById('check-length').innerHTML = (temLength ? '✓' : '✗') + ' Mínimo 8 caracteres';
            
            document.getElementById('check-upper').style.color = temUpper ? '#28a745' : '#999';
            document.getElementById('check-upper').innerHTML = (temUpper ? '✓' : '✗') + ' Pelo menos 1 letra maiúscula';
            
            document.getElementById('check-lower').style.color = temLower ? '#28a745' : '#999';
            document.getElementById('check-lower').innerHTML = (temLower ? '✓' : '✗') + ' Pelo menos 1 letra minúscula';
            
            document.getElementById('check-number').style.color = temNumber ? '#28a745' : '#999';
            document.getElementById('check-number').innerHTML = (temNumber ? '✓' : '✗') + ' Pelo menos 1 número';
            
            document.getElementById('check-special').style.color = temSpecial ? '#28a745' : '#999';
            document.getElementById('check-special').innerHTML = (temSpecial ? '✓' : '✗') + ' Pelo menos 1 caractere especial (!@#$%^&*)';
        });
        
        document.getElementById('form-redefinir').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const senha = document.getElementById('senha').value;
            const confirmarSenha = document.getElementById('confirmar-senha').value;
            
            // Validar complexidade
            const temLength = senha.length >= 8;
            const temUpper = /[A-Z]/.test(senha);
            const temLower = /[a-z]/.test(senha);
            const temNumber = /[0-9]/.test(senha);
            const temSpecial = /[!@#$%^&*]/.test(senha);
            
            if (!temLength || !temUpper || !temLower || !temNumber || !temSpecial) {
                document.getElementById('message').innerHTML = '<div class="message error">A senha não atende aos requisitos de complexidade.</div>';
                return;
            }
            
            if (senha !== confirmarSenha) {
                document.getElementById('message').innerHTML = '<div class="message error">As senhas não coincidem.</div>';
                return;
            }
            
            const xhr = new XMLHttpRequest();
            xhr.open('POST', '/crpdesk/api/controllers/redefinir-senha.php', true);
            xhr.setRequestHeader('Content-Type', 'application/json');
            
            xhr.onload = function() {
                if (xhr.status === 200) {
                    document.getElementById('message').innerHTML = '<div class="message success">Senha redefinida com sucesso! Redirecionando...</div>';
                    document.getElementById('form-redefinir').style.display = 'none';
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    const response = JSON.parse(xhr.responseText);
                    document.getElementById('message').innerHTML = '<div class="message error">' + response.error + '</div>';
                }
            };
            
            xhr.send(JSON.stringify({
                token: token,
                senha: senha
            }));
        });
    </script>
</body>
</html>
