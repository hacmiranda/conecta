<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logotipos com o símbolo no lugar do C - Conecta</title>
<link rel="stylesheet" href="preview.css">
</head>
<body>
<main>
<h1>Conecta CRPRS — 3 propostas com o símbolo no lugar do “C”</h1>
<p>O símbolo oficial (logo_vazado.png) faz o papel da letra C de Conecta.</p>
<div class="grade">
<figure><img src="logo-g-palavra.svg" alt="Proposta G"><figcaption><strong>G — Palavra.</strong> O símbolo é o C de Conecta; abaixo, o que o sistema faz: gestão de demandas por setor.</figcaption><div class="mini"><img src="logo-g-palavra.svg" alt=""></div></figure>
<figure><img src="logo-h-duas-linhas.svg" alt="Proposta H"><figcaption><strong>H — Duas linhas.</strong> O C abraça ONECTA e CRPRS: um ponto de entrada para todos os setores.</figcaption><div class="mini"><img src="logo-h-duas-linhas.svg" alt=""></div></figure>
<figure><img src="logo-i-fluxo.svg" alt="Proposta I"><figcaption><strong>I — Fluxo.</strong> Abaixo do nome, o caminho de cada demanda: recebe (e-mail), encaminha (setor), responde.</figcaption></figure>
</div>
</main>
</body>
</html>
