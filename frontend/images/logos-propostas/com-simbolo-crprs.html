<main>
<h1>Conecta CRPRS — 3 propostas com o símbolo do CRPRS</h1>
<p>Usa o "C" oficial (logo_vazado.png) como símbolo, com a paleta oficial.</p>
<div class="grade">
<figure><img src="logo-d-horizontal.svg" alt="Proposta D: horizontal"><figcaption><strong>D — Horizontal.</strong> Símbolo à esquerda, nome em vinho escuro e CRPRS em vinho.</figcaption><div class="mini"><img src="logo-d-horizontal.svg" alt=""></div></figure>
<figure><img src="logo-e-vertical.svg" alt="Proposta E: vertical"><figcaption><strong>E — Vertical.</strong> Símbolo sobre o nome, com a descrição "Gestão de demandas por setor".</figcaption></figure>
<figure><img src="logo-f-selo-vinho.svg" alt="Proposta F: selo vinho"><figcaption><strong>F — Selo vinho.</strong> Versão em fundo vinho, com o símbolo num círculo branco. Serve para cabeçalho e rodapé.</figcaption><div class="mini"><img src="logo-f-selo-vinho.svg" alt=""></div></figure>
</div>
