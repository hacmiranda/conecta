<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 310 72" role="img" aria-labelledby="ta">
  <title id="ta">Conecta CRPRS</title>
  <defs>
    <linearGradient id="fundoA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C72D24"/>
      <stop offset="1" stop-color="#5E130E"/>
    </linearGradient>
  </defs>
  <!-- Símbolo: três pontos (setores) ligados a um núcleo central -->
  <rect x="4" y="4" width="64" height="64" rx="15" fill="url(#fundoA)"/>
  <g stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none">
    <line x1="36" y1="36" x2="21" y2="23"/>
    <line x1="36" y1="36" x2="52" y2="27"/>
    <line x1="36" y1="36" x2="33" y2="54"/>
  </g>
  <circle cx="36" cy="36" r="7" fill="#FFFFFF"/>
  <circle cx="21" cy="23" r="6" fill="#F89327"/>
  <circle cx="52" cy="27" r="6" fill="#70AB2A"/>
  <circle cx="33" cy="54" r="6" fill="#FBE9E7"/>
  <!-- Texto -->
  <text x="84" y="42" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="32" font-weight="800" letter-spacing="-0.5" fill="#A7241C">Conecta</text>
  <text x="85" y="60" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="5.5" fill="#F89327">CRPRS</text>
