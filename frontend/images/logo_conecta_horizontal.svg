<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 76" width="100%" height="100%" role="img" aria-label="Logotipo Conecta CRPRS">
  <defs>
    <!-- Gradiente Laranja Suporte -->
    <linearGradient id="gradOrangeH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA845"/>
      <stop offset="100%" stop-color="#F89327"/>
    </linearGradient>

    <!-- Gradiente Vermelho Institucional -->
    <linearGradient id="gradRedH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C72D24"/>
      <stop offset="100%" stop-color="#A7241C"/>
    </linearGradient>

    <!-- Gradiente Verde Dinâmico -->
    <linearGradient id="gradGreenH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84C732"/>
      <stop offset="100%" stop-color="#70AB2A"/>
    </linearGradient>

    <filter id="softGlowH" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.8" flood-color="#5E130E" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- SÍMBOLO / ÍCONE (Posicionado à esquerda) -->
  <g transform="translate(4, 3) scale(0.70)" filter="url(#softGlowH)">
    <!-- Balão Laranja -->
    <path d="M 18,24 C 18,17.4 23.4,12 30,12 L 52,12 C 58.6,12 64,17.4 64,24 L 64,40 C 64,46.6 58.6,52 52,52 L 32,52 L 20,62 L 20,48 C 18.7,46.5 18,44.4 18,42 Z" 
          fill="url(#gradOrangeH)"/>
    <circle cx="36" cy="32" r="5.5" fill="#FFFFFF"/>
    <circle cx="36" cy="32" r="2.8" fill="#F89327"/>

    <!-- Balão Vermelho -->
    <path d="M 82,76 C 82,82.6 76.6,88 70,88 L 48,88 C 41.4,88 36,82.6 36,76 L 36,60 C 36,53.4 41.4,48 48,48 L 68,48 L 80,38 L 80,52 C 81.3,53.5 82,55.6 82,58 Z" 
          fill="url(#gradRedH)"/>
    <circle cx="64" cy="68" r="5.5" fill="#FFFFFF"/>
    <circle cx="64" cy="68" r="2.8" fill="#A7241C"/>

    <!-- Ponte Conexão e nós -->
    <path d="M 39,32 C 54,32 46,68 61,68" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M 39,32 C 54,32 46,68 61,68" stroke="url(#gradGreenH)" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="50" cy="50" r="5.5" fill="#FFFFFF"/>
    <circle cx="50" cy="50" r="3.8" fill="url(#gradGreenH)"/>

    <!-- Flechas dinâmicas de fluxo -->
    <path d="M 60,20 C 72,20 78,24 81,30" stroke="url(#gradGreenH)" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <polygon points="84,33 77,29 83,25" fill="#70AB2A"/>

    <path d="M 40,80 C 28,80 22,76 19,70" stroke="url(#gradGreenH)" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <polygon points="16,67 23,71 17,75" fill="#70AB2A"/>
  </g>

  <!-- TIPOGRAFIA INSTITUCIONAL -->
  <!-- "CONECTA" -->
  <text x="82" y="41" 
        font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" 
        font-size="30" 
        font-weight="800" 
        letter-spacing="-0.5" 
        fill="#F89327">
    CONECTA
  </text>

  <!-- "CRPRS" -->
  <text x="228" y="41" 
        font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" 
        font-size="30" 
        font-weight="800" 
        letter-spacing="-0.5" 
        fill="#A7241C">
    CRPRS
  </text>

  <!-- Pílula / Detalhe Verde Dinâmico indicador de status do sistema -->
  <rect x="83" y="49" width="32" height="3" rx="1.5" fill="#70AB2A"/>

  <!-- Subtítulo institucional acessível -->
  <text x="122" y="56" 
        font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" 
        font-size="10.5" 
        font-weight="600" 
        letter-spacing="1.8" 
        fill="#554B47">
    SISTEMA DE GESTÃO &amp; SUPORTE
  </text>
</svg>
